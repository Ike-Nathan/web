name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check unused code
        run: npm run knip

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Test with coverage
        id: coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ''

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

      - name: Post coverage summary to PR
        if: always() && github.event_name == 'pull_request' && steps.coverage.outcome != 'skipped'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- vitest-coverage-summary -->'
            const reportPath = 'coverage/coverage-summary.json'
            let body

            if (fs.existsSync(reportPath)) {
              const { total } = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
              const metrics = ['lines', 'functions', 'branches', 'statements']
              const rows = metrics.map((name) => {
                const metric = total[name]
                return `| ${name} | ${metric.covered} / ${metric.total} | ${metric.pct.toFixed(1)}% |`
              })
              body = `${marker}\n## Test coverage\n\n| Metric | Covered | Coverage |\n| --- | ---: | ---: |\n${rows.join('\n')}`
            } else {
              body = `${marker}\n## Test coverage\n\nCoverage summary was not generated. Check the test-with-coverage step for errors.`
            }

            await core.summary.addRaw(body.replace(marker, '').trim()).write()

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  e2e:
    name: End-to-end · Chromium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e
        env:
          NEXT_PUBLIC_API_URL: ''

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
